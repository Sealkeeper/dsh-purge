name: Release

# Fork note: upstream triggered this on every push to master and required
# release-notes.md line 1 to equal the package version, which is not the case
# for the 1.1.85 snapshot (notes file starts at # 1.1.78). Here the release is
# manual / tag-driven, and the notes header is generated from package.json.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: v<package version>)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Sealkeeper/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          set -euo pipefail
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi

          notes="$(mktemp)"
          {
            echo "# ${version}"
            echo
            echo "Upstream: [YuJunZhiXue/dsh-purge](https://github.com/YuJunZhiXue/dsh-purge) · Apache-2.0 · 二开 fork，署名保留。"
            echo
            # release-notes.md 的历史段落照抄，但去掉可能与版本号冲突的首行标题
            if [ -f release-notes.md ]; then
              tail -n +2 release-notes.md
            fi
          } > "$notes"

          zip="dsh-purge-${version}.zip"
          git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD

          args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=(--verify-tag)
          fi
          case "$version" in
            *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}" || {
            # tag 已存在时仍然补齐产物
            gh release create "$tag" --title "$tag" --notes-file "$notes" --verify-tag || true
          }

          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/Sealkeeper/dsh-purge/releases/tag/${tag}"
